<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNITED AJ AUCTION — SLOT DRAW</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inconsolata:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0cc6e;
    --gold-dark: #8b6914;
    --cream: #f5eed8;
    --dark: #0e0c08;
    --dark2: #1a1710;
    --dark3: #252218;
    --red: #c0392b;
    --green: #27ae60;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Playfair Display', serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image: 
      radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(201,168,76,0.03) 0%, transparent 50%);
  }

  /* Decorative corner lines */
  body::before {
    content: '';
    position: fixed;
    top: 20px; left: 20px; right: 20px; bottom: 20px;
    border: 1px solid rgba(201,168,76,0.15);
    pointer-events: none;
    z-index: 1000;
  }

  header {
    text-align: center;
    padding: 50px 20px 30px;
    position: relative;
  }

  .header-ornament {
    font-family: 'Inconsolata', monospace;
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 8px;
    opacity: 0.6;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(60px, 10vw, 120px);
    letter-spacing: 12px;
    background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-light) 50%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    text-shadow: none;
    filter: drop-shadow(0 0 30px rgba(201,168,76,0.3));
  }

  .subtitle {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: rgba(245,238,216,0.5);
    font-size: 16px;
    letter-spacing: 3px;
    margin-top: 8px;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 20px auto;
    max-width: 400px;
  }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .divider-diamond {
    width: 8px; height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* Control Panel */
  .control-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 30px 20px;
  }

  .stats-bar {
    display: flex;
    gap: 40px;
    font-family: 'Inconsolata', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(245,238,216,0.6);
  }
  .stat span {
    color: var(--gold-light);
    font-size: 22px;
    font-weight: 700;
    display: block;
    text-align: center;
  }

  /* Generate Button */
  .btn-generate {
    position: relative;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 6px;
    color: var(--dark);
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-light), var(--gold-dark));
    border: none;
    padding: 18px 55px;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 50px;
    text-transform: uppercase;
  }
  .btn-generate:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--gold), var(--cream), var(--gold));
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(201,168,76,0.5);
  }
  .btn-generate:active:not(:disabled) { transform: translateY(0); }
  .btn-generate:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }



  /* Current Number Display */
  .current-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    background: var(--dark2);
    border: 1px solid rgba(201,168,76,0.2);
    padding: 25px 50px;
    position: relative;
    min-width: 260px;
  }
  .current-display::before, .current-display::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    border: 2px solid var(--gold);
  }
  .current-display::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .current-display::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .current-label {
    font-family: 'Inconsolata', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.7;
  }

  .current-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    line-height: 1;
    color: var(--gold-light);
    filter: drop-shadow(0 0 20px rgba(240,204,110,0.6));
    min-width: 3ch;
    text-align: center;
    transition: color 0.2s;
  }

  .current-number.rolling {
    animation: roll-numbers 0.08s infinite;
    color: var(--cream);
  }

  @keyframes roll-numbers {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    50% { transform: translateY(-5px) scale(1.05); opacity: 0.7; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  .current-number.reveal {
    animation: reveal-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes reveal-pop {
    0% { transform: scale(0.5); opacity: 0; filter: blur(10px) drop-shadow(0 0 40px rgba(240,204,110,1)); }
    60% { transform: scale(1.15); opacity: 1; filter: blur(0) drop-shadow(0 0 30px rgba(240,204,110,0.8)); }
    100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 15px rgba(240,204,110,0.5)); }
  }

  /* Slots Grid */
  .grid-section {
    padding: 20px 40px 60px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .grid-title {
    font-family: 'Inconsolata', monospace;
    font-size: 11px;
    letter-spacing: 5px;
    color: rgba(201,168,76,0.5);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 20px;
  }

  .slots-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
  }

  .slot {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    background: var(--dark2);
    border: 1px solid rgba(201,168,76,0.1);
    color: rgba(245,238,216,0.25);
    position: relative;
    transition: all 0.3s ease;
    cursor: default;
    overflow: hidden;
  }

  .slot::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(201,168,76,0.03) 100%);
  }

  .slot.drawn {
    background: linear-gradient(135deg, var(--dark3), rgba(201,168,76,0.08));
    border-color: var(--gold);
    color: var(--gold-light);
    box-shadow: 0 0 15px rgba(201,168,76,0.2), inset 0 0 15px rgba(201,168,76,0.05);
    animation: slot-drawn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .slot.latest {
    border-color: var(--gold-light);
    box-shadow: 0 0 25px rgba(240,204,110,0.5), inset 0 0 20px rgba(240,204,110,0.1);
    animation: slot-latest 1s ease forwards;
  }

  @keyframes slot-drawn {
    0% { transform: scale(0.8) rotateY(90deg); opacity: 0; }
    60% { transform: scale(1.1) rotateY(-5deg); }
    100% { transform: scale(1) rotateY(0deg); opacity: 1; }
  }

  @keyframes slot-latest {
    0% { transform: scale(1.2); box-shadow: 0 0 50px rgba(240,204,110,0.8), inset 0 0 30px rgba(240,204,110,0.2); }
    50% { box-shadow: 0 0 30px rgba(240,204,110,0.6), inset 0 0 20px rgba(240,204,110,0.1); }
    100% { transform: scale(1); box-shadow: 0 0 20px rgba(240,204,110,0.4), inset 0 0 15px rgba(240,204,110,0.08); }
  }

  .slot .slot-num { position: relative; z-index: 1; }
  .slot .slot-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    font-family: 'Inconsolata', monospace;
    font-size: 8px;
    color: var(--gold);
    opacity: 0;
    letter-spacing: 0;
  }
  .slot.drawn .slot-badge { opacity: 0.7; }

  /* History */
  .history-section {
    max-width: 1200px;
    margin: 0 auto 40px;
    padding: 0 40px;
  }
  .history-title {
    font-family: 'Inconsolata', monospace;
    font-size: 11px;
    letter-spacing: 5px;
    color: rgba(201,168,76,0.5);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .history-track {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .history-chip {
    font-family: 'Inconsolata', monospace;
    font-size: 13px;
    font-weight: 700;
    padding: 5px 12px;
    background: rgba(201,168,76,0.08);
    border: 1px solid rgba(201,168,76,0.2);
    color: var(--gold);
    animation: chip-in 0.3s ease;
  }
  @keyframes chip-in {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* Confetti burst for first draw */
  .burst-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .burst-overlay.active { opacity: 1; }
  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 1px;
    animation: particle-fall 1.2s ease-out forwards;
  }
  @keyframes particle-fall {
    0% { transform: translate(0, -20px) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), 100vh) rotate(720deg); opacity: 0; }
  }

  /* All drawn message */
  .all-drawn {
    text-align: center;
    padding: 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 8px;
    color: var(--gold);
    display: none;
    animation: fadeIn 0.8s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 600px) {
    .slots-grid { grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 5px; }
    .slot { font-size: 22px; }
    .stats-bar { gap: 20px; }
    .grid-section, .history-section { padding-left: 20px; padding-right: 20px; }
    h1 { font-size: 60px; }
  }
</style>
</head>
<body>

<div class="burst-overlay" id="burst"></div>

<header>
  <div class="header-ornament">SEASON 2</div>
  <h1>UNITED AJ Auction</h1>
  <div class="subtitle">Slot Number Draw</div>
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-diamond"></div>
    <div class="divider-line"></div>
  </div>
</header>

<div class="control-panel">
  <div class="stats-bar">
    <div class="stat"><span id="stat-drawn">0</span>DRAWN</div>
    <div class="stat"><span id="stat-remaining">80</span>REMAINING</div>
    <div class="stat"><span id="stat-total">80</span>TOTAL</div>
  </div>

  <div class="current-display">
    <div class="current-label">Current Slot</div>
    <div class="current-number" id="current-num">—</div>
  </div>

  <button class="btn-generate" id="btn-draw" onclick="drawNextSlot()">
    Draw Next Slot
  </button>

  <div class="all-drawn" id="all-drawn-msg">
    ✦ All 80 Slots Drawn ✦
  </div>


</div>

<div class="history-section">
  <div class="history-title">Draw History</div>
  <div class="history-track" id="history-track"></div>
</div>

<div class="grid-section">
  <div class="grid-title">All Slots — 1 to 80</div>
  <div class="slots-grid" id="slots-grid"></div>
</div>

<script>
  const TOTAL = 80;
  let pool = [];
  let drawn = [];
  let isAnimating = false;
  let drawOrder = 0;

  function init() {
    pool = Array.from({length: TOTAL}, (_, i) => i + 1);
    drawn = [];
    drawOrder = 0;
    renderGrid();
    updateStats();
    document.getElementById('current-num').textContent = '—';
    document.getElementById('current-num').classList.remove('rolling', 'reveal');
    document.getElementById('history-track').innerHTML = '';
    document.getElementById('all-drawn-msg').style.display = 'none';
    document.getElementById('btn-draw').disabled = false;
  }

  function renderGrid() {
    const grid = document.getElementById('slots-grid');
    grid.innerHTML = '';
    for (let i = 1; i <= TOTAL; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.id = `slot-${i}`;
      slot.innerHTML = `<span class="slot-num">${i}</span><span class="slot-badge">✦</span>`;
      grid.appendChild(slot);
    }
  }

  function updateStats() {
    document.getElementById('stat-drawn').textContent = drawn.length;
    document.getElementById('stat-remaining').textContent = pool.length;
  }

  function drawNextSlot() {
    if (isAnimating || pool.length === 0) return;
    isAnimating = true;
    document.getElementById('btn-draw').disabled = true;

    const numEl = document.getElementById('current-num');
    numEl.classList.remove('reveal');
    numEl.classList.add('rolling');

    // Pick random slot
    const idx = Math.floor(Math.random() * pool.length);
    const chosen = pool.splice(idx, 1)[0];
    drawn.push(chosen);
    drawOrder++;

    // Rolling animation with random numbers
    let rollCount = 0;
    const maxRolls = 22;
    const rollInterval = setInterval(() => {
      rollCount++;
      const fake = Math.floor(Math.random() * TOTAL) + 1;
      numEl.textContent = fake < 10 ? '0' + fake : fake;

      if (rollCount >= maxRolls) {
        clearInterval(rollInterval);
        // Reveal
        numEl.classList.remove('rolling');
        numEl.textContent = chosen < 10 ? '0' + chosen : chosen;
        numEl.classList.add('reveal');

        // Mark slot
        const slotEl = document.getElementById(`slot-${chosen}`);
        // Remove latest from previous
        document.querySelectorAll('.slot.latest').forEach(s => {
          s.classList.remove('latest');
        });
        slotEl.classList.add('drawn', 'latest');
        slotEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

        // Add to history
        addHistory(chosen, drawOrder);
        updateStats();

        // Burst particles on every draw
        triggerBurst();

        // Delay before enabling button
        setTimeout(() => {
          isAnimating = false;
          if (pool.length === 0) {
            document.getElementById('all-drawn-msg').style.display = 'block';
          } else {
            document.getElementById('btn-draw').disabled = false;
          }
        }, 700);
      }
    }, 80);
  }

  function addHistory(num, order) {
    const track = document.getElementById('history-track');
    const chip = document.createElement('div');
    chip.className = 'history-chip';
    chip.textContent = `#${order}: ${num < 10 ? '0' + num : num}`;
    track.prepend(chip);
  }

  function triggerBurst() {
    const burst = document.getElementById('burst');
    burst.innerHTML = '';
    burst.classList.add('active');
    const colors = ['#c9a84c', '#f0cc6e', '#f5eed8', '#c0392b', '#ffffff'];
    const cx = window.innerWidth / 2;

    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = (cx + (Math.random() - 0.5) * 200) + 'px';
      p.style.top = '30%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      const dx = (Math.random() - 0.5) * 500;
      p.style.setProperty('--dx', dx + 'px');
      p.style.animationDelay = (Math.random() * 0.3) + 's';
      p.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
      burst.appendChild(p);
    }

    setTimeout(() => {
      burst.classList.remove('active');
      setTimeout(() => burst.innerHTML = '', 500);
    }, 1500);
  }

  function resetAuction() {
    if (isAnimating) return;
    init();
  }

  // Initialize on load
  init();
</script>
</body>
</html>
